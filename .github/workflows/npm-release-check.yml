# 公開前に、3つの OS で実変換と tarball の独立導入を検査する。
# Node.js の対応版（22・24・26）は OS ごとに1つずつ割り当て、3ジョブで全版を1回ずつ通す（全組み合わせは回さない）。
# 描画にはランナーにあらかじめ入っている Google Chrome を使い、Chromium と Linux の依存パッケージの導入を省く。
# npm-publish.yml からも workflow_call で再利用し、公開するコミットに対して同じ検査を公開直前に必ず通す。
name: npm release check

on:
  # タグ push は npm-publish.yml が本ワークフローを呼び出すため、同じ検査の二重実行を避ける。
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

# 検査ジョブはリポジトリの読み取りだけで足りる。公開権限は npm-publish.yml の publish ジョブだけに与える。
permissions:
  contents: read

jobs:
  package-matrix:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            browser: /usr/bin/google-chrome
          - os: windows-latest
            node: 24
            browser: C:\Program Files\Google\Chrome\Application\chrome.exe
          - os: macos-latest
            node: 26
            browser: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    env:
      MVE_REQUIRE_BROWSER_TESTS: '1'
      MVE_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # パッケージ検査の npm pack が prepack でビルドするため、テストはその成果物で実行し、ビルドを繰り返さない。
      - run: npm run test:package
      - run: npm run test:run

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ビルド時依存も生成物へバンドルされるため、開発依存を除外しない。
      - run: npm audit --audit-level=high
